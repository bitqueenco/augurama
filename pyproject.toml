[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "augurama"
version = "1.0.0"
description = "Autonomous video directing and multimodal storyboard orchestration engine powered by fal.ai."
requires-python = ">=3.11"
license = "LicenseRef-Corgi-Verse-Proprietary"
authors = [{name = "Corgi-Verse Software"}]
dependencies = [
  "fastapi==0.128.2", "starlette==0.50.0", "uvicorn==0.48.0",
  "httpx==0.28.1", "pydantic==2.13.4", "cryptography==46.0.4",
  "argon2-cffi==25.1.0", "Pillow==12.3.0", "python-multipart==0.0.29"
]

[project.optional-dependencies]
test = ["pytest==9.0.2", "jsonschema==4.26.0", "playwright==1.57.0"]
sdkcheck = ["mcp>=2,<3"]

[project.scripts]
augurama = "augurama.cli:main"
dreamina-director = "augurama.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
augurama = ["data/models/*.json", "data/recipes/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["sdk: requires the separately installed official MCP SDK", "browser: browser integration checks"]
