# Private backend only. Terminate HTTPS on your already authorized host/proxy.
# No new hosting service is provisioned by this file.
services:
  director:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - .env.production
    volumes:
      - director-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 120s
volumes:
  director-data:
